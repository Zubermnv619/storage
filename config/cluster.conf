# Cluster configuration for the distributed KV loader.
# Lines starting with '#' are comments; blank lines are ignored.

# Number of mock nodes to run (1-5).
num_nodes=4

# Directory containing per-node data files, named node<ID>.dat
# (e.g. data/node0.dat, data/node1.dat, ...).
data_dir=data

# Schema. Field order matters: the FIRST field declared is the record key.
# Supported types: int32, string
field=user_id:int32
field=user_name:string
field=country:string
field=score:int32
